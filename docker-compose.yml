name: taskflow

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.13.4
    restart: unless-stopped
    environment:
      # Obligatoria: si se pasa vacía, Qdrant exige igualmente la cabecera api-key y la app no la envía
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Define QDRANT_API_KEY en .env}
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    healthcheck:
      # La imagen de Qdrant no incluye curl/wget: se comprueba el puerto con bash
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: taskflow-app:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-taskflow}
      DB_USERNAME: ${POSTGRES_USER:-taskflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-1440}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Bogota}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-not-configured}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-gpt-4o-mini}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
      RAG_TOP_K: ${RAG_TOP_K:-8}
      RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.2}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-taskflow_tasks}
      N8N_API_KEY: ${N8N_API_KEY:?Define N8N_API_KEY en .env}
      # Producción: /webhook/... | Modo prueba del editor de n8n: /webhook-test/...
      N8N_TASK_ASSIGNED_WEBHOOK_URL: ${N8N_TASK_ASSIGNED_WEBHOOK_URL:-http://n8n:5678/webhook/taskflow-task-assigned}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  n8n:
    image: n8nio/n8n:1.80.0
    restart: unless-stopped
    environment:
      GENERIC_TIMEZONE: ${APP_TIMEZONE:-America/Bogota}
      TZ: ${APP_TIMEZONE:-America/Bogota}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Define N8N_ENCRYPTION_KEY en .env}
      # Los workflows leen estas variables con $env
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      TASKFLOW_BASE_URL: http://app:8080
      TASKFLOW_N8N_API_KEY: ${N8N_API_KEY}
    # Importa y activa los workflows de TaskFlow en cada arranque (los IDs son fijos: no se duplican)
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        n8n import:workflow --separate --input=/workflows
        for id in tfDueReminder001 tfOverdueAlert01 tfDailySummary01 tfTaskAssigned01; do
          n8n update:workflow --id=$$id --active=true
        done
        exec n8n start
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    ports:
      - "${N8N_PORT:-5678}:5678"
    healthcheck:
      # 127.0.0.1 y no localhost: en la imagen de n8n localhost resuelve a ::1 y n8n solo escucha en IPv4
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10

volumes:
  postgres_data:
  qdrant_data:
  n8n_data:
