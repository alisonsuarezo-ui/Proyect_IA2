<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow · Búsqueda inteligente</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="search">
<div class="app">
  <div class="main">
    <main class="content">
      <div class="page-header">
        <div>
          <h1>✨ Búsqueda inteligente</h1>
          <p class="muted">Pregunta en lenguaje natural: TaskFlow recupera tus tareas con embeddings (Qdrant) y responde con RAG.</p>
        </div>
      </div>

      <div id="ai-status"></div>

      <div class="card">
        <div class="filters" style="margin-bottom:.75rem">
          <div class="form-group" style="max-width:320px">
            <label for="scope">Ámbito</label>
            <select id="scope"><option value="">Todos mis proyectos</option></select>
          </div>
          <div class="form-group" style="max-width:260px">
            <label for="mode">Modo</label>
            <select id="mode">
              <option value="ask">Preguntar (RAG + LLM)</option>
              <option value="search">Solo búsqueda semántica</option>
            </select>
          </div>
        </div>
        <form id="ask-form" class="ask-box">
          <input id="question" maxlength="1000" placeholder="Ej.: ¿Qué tareas relacionadas con el frontend están atrasadas?" autocomplete="off">
          <button class="btn" type="submit" id="ask-btn">Consultar</button>
        </form>
        <div class="chips" id="examples"></div>
      </div>

      <div class="card hidden" id="answer-card">
        <div class="card-header"><h2>Respuesta</h2><span class="small muted" id="answer-meta"></span></div>
        <div class="answer" id="answer"></div>
      </div>

      <div class="card hidden" id="sources-card">
        <div class="card-header"><h2 id="sources-title">Tareas recuperadas</h2><span class="small muted">Similitud coseno (Qdrant)</span></div>
        <div id="sources"></div>
      </div>
    </main>
  </div>
</div>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/search.js"></script>
</body>
</html>
