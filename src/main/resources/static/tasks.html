<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow · Tareas</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="tasks">
<div class="app">
  <div class="main">
    <main class="content">
      <div class="page-header">
        <div>
          <h1>Tareas</h1>
          <p class="muted" id="tasks-subtitle">Todas las tareas de tus proyectos</p>
        </div>
        <button class="btn" id="new-task-btn">+ Nueva tarea</button>
      </div>

      <div class="card">
        <div class="filters">
          <div class="form-group">
            <label for="f-q">Texto</label>
            <input id="f-q" placeholder="Título o descripción...">
          </div>
          <div class="form-group">
            <label for="f-project">Proyecto</label>
            <select id="f-project"><option value="">Todos</option></select>
          </div>
          <div class="form-group">
            <label for="f-status">Estado</label>
            <select id="f-status">
              <option value="">Todos</option>
              <option value="PENDIENTE">Pendiente</option>
              <option value="EN_PROGRESO">En progreso</option>
              <option value="COMPLETADA">Completada</option>
            </select>
          </div>
          <div class="form-group">
            <label for="f-priority">Prioridad</label>
            <select id="f-priority">
              <option value="">Todas</option>
              <option value="URGENTE">Urgente</option>
              <option value="ALTA">Alta</option>
              <option value="MEDIA">Media</option>
              <option value="BAJA">Baja</option>
            </select>
          </div>
          <div class="form-group">
            <label for="f-assignee">Responsable</label>
            <select id="f-assignee"><option value="">Todos</option></select>
          </div>
          <div class="form-group" style="min-width:auto;flex:0">
            <label for="f-overdue">Atrasadas</label>
            <input type="checkbox" id="f-overdue" style="width:auto;margin:.6rem 0">
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
            <tr>
              <th>Tarea</th>
              <th class="hide-sm">Proyecto</th>
              <th>Estado</th>
              <th>Prioridad</th>
              <th class="hide-sm">Responsable</th>
              <th>Fecha límite</th>
              <th style="text-align:right">Acciones</th>
            </tr>
            </thead>
            <tbody id="task-rows"></tbody>
          </table>
        </div>
        <p class="small muted" id="task-count" style="margin:.75rem 0 0"></p>
      </div>
    </main>
  </div>
</div>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/task-form.js"></script>
<script src="/js/tasks.js"></script>
</body>
</html>
