<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow · Proyectos</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="projects">
<div class="app">
  <div class="main">
    <main class="content">
      <div class="page-header">
        <div>
          <h1>Proyectos</h1>
          <p class="muted">Proyectos en los que eres propietario o miembro</p>
        </div>
        <button class="btn" id="new-project-btn">+ Nuevo proyecto</button>
      </div>
      <div class="filters">
        <div class="form-group">
          <label for="filter-q">Buscar</label>
          <input id="filter-q" placeholder="Nombre o descripción...">
        </div>
      </div>
      <div class="grid grid-3" id="project-grid"></div>
    </main>
  </div>
</div>

<div class="modal-backdrop" id="project-modal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="project-modal-title">
    <div class="modal-header">
      <h2 id="project-modal-title">Nuevo proyecto</h2>
      <button class="btn btn-ghost btn-sm" data-close-modal="project-modal" aria-label="Cerrar">✕</button>
    </div>
    <form id="project-form" novalidate>
      <div class="modal-body">
        <div class="form-group">
          <label for="p-name">Nombre *</label>
          <input id="p-name" name="name" required maxlength="150">
        </div>
        <div class="form-group">
          <label for="p-description">Descripción</label>
          <textarea id="p-description" name="description" maxlength="2000"></textarea>
        </div>
        <div class="form-group">
          <label for="p-members">Miembros del equipo</label>
          <select id="p-members" name="memberIds" multiple></select>
          <span class="small muted">Mantén Ctrl (o Cmd) para seleccionar varios. El propietario siempre tiene acceso.</span>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-close-modal="project-modal">Cancelar</button>
        <button type="submit" class="btn" id="project-save-btn">Guardar</button>
      </div>
    </form>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/projects.js"></script>
</body>
</html>
